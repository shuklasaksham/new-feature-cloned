crons:
  - name: daily-digest
    description: "Sends each user their Bracket daily digest (attention items + memory updates) at 9am IST"
    cron: "0 9 * * *"
    timezone: "Asia/Kolkata"
    endpoint: "{{BASE_URL}}/api/cron/digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
